PUBLIC SITE ══════════════════ -->
  <sc-if value="{{ is.public }}" hint-placeholder-val="{{ true }}">
  <div>
    <div style="width:100%;max-width:1320px;margin:0 auto;padding:18px 24px 0;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:26px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:11px">
          <div style="width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#8ad356,#2f8f3c)"></div>
          <div style="font:800 21px 'Manrope',sans-serif;letter-spacing:-.025em">NeuroTech Summit</div>
        </div>
        <div style="display:flex;gap:4px;background:#fff;border:1px solid rgba(18,21,12,.08);border-radius:999px;padding:5px">
          <sc-for list="{{ siteNav }}" as="n" hint-placeholder-count="5">
            <button onClick="{{ n.go }}" style="border:none;background:{{ n.bg }};color:{{ n.fg }};border-radius:999px;padding:9px 16px;font:500 14px 'DM Sans',sans-serif;cursor:pointer">{{ n.label }}</button>
          </sc-for>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:14px">
        <button style="border:none;background:none;font:600 14px 'DM Sans',sans-serif;color:#12150c;cursor:pointer">Login</button>
        <button onClick="{{ goRegister }}" style="border:none;background:#111510;color:#fff;border-radius:999px;padding:12px 22px;font:600 14px 'DM Sans',sans-serif;cursor:pointer" style-hover="background:#2f8f3c">Get Started</button>
      </div>
    </div>
